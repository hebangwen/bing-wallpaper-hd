<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <link rel="stylesheet" href="options.css" />
  <title data-i18n="optionsTitle"></title>
</head>
<body>
  <main>
    <header>
      <h1 data-i18n="extName"></h1>
      <p class="lead" data-i18n="optionsLead"></p>
    </header>

    <section>
      <h2 data-i18n="sectionWallpaper"></h2>

      <div class="field">
        <span data-i18n="labelSource"></span>
        <select id="source"></select>
        <small data-i18n="sourceHint"></small>
      </div>

      <div class="field">
        <span data-i18n="labelQuality"></span>
        <select id="quality"></select>
        <small data-i18n="qualityHint"></small>
      </div>

      <div class="field" id="custom-quality" hidden>
        <span data-i18n="labelCustom"></span>
        <div class="inline">
          <input id="custom-width" type="number" min="320" max="7680" step="1" aria-label="width" />
          <span>×</span>
          <input id="custom-height" type="number" min="240" max="4320" step="1" aria-label="height" />
          <button id="apply-quality" type="button" data-i18n="applyQuality"></button>
        </div>
      </div>

      <label class="field">
        <span data-i18n="labelLanguage"></span>
        <select id="market"></select>
        <small data-i18n="languageHint"></small>
      </label>

      <label class="field">
        <span data-i18n="labelRetention"></span>
        <select id="retention"></select>
        <small data-i18n="retentionHint"></small>
      </label>

      <label class="field">
        <span data-i18n="labelUpdateHour"></span>
        <select id="hour"></select>
        <small data-i18n="updateHourHint"></small>
      </label>
    </section>

    <section>
      <h2 data-i18n="sectionClock"></h2>

      <label class="field checkbox">
        <input id="show-clock" type="checkbox" />
        <span data-i18n="labelShowClock"></span>
      </label>

      <label class="field checkbox">
        <input id="show-seconds" type="checkbox" />
        <span data-i18n="labelShowSeconds"></span>
      </label>

      <label class="field checkbox">
        <input id="hour24" type="checkbox" />
        <span data-i18n="labelHour24"></span>
      </label>

      <label class="field">
        <span data-i18n="labelDateStyle"></span>
        <select id="date-style"></select>
      </label>

      <small data-i18n="clockHint"></small>
    </section>

    <section>
      <h2 data-i18n="sectionEffects"></h2>

      <div class="field">
        <span data-i18n="labelBlur"></span>
        <div class="range">
          <input id="blur" type="range" min="0" max="40" step="1" />
          <output id="blur-value">0 px</output>
        </div>
      </div>

      <div class="field">
        <span data-i18n="labelDim"></span>
        <div class="range">
          <input id="dim" type="range" min="0" max="70" step="1" />
          <output id="dim-value">0%</output>
        </div>
      </div>

      <label class="field checkbox">
        <input id="glass" type="checkbox" />
        <span data-i18n="labelGlass"></span>
      </label>

      <div class="preview" id="preview" data-glass="off">
        <div class="preview-image" id="preview-image"></div>
        <div class="preview-dim"></div>
        <div class="preview-glass">20:46</div>
      </div>

      <small data-i18n="effectsHint"></small>
    </section>

    <section>
      <h2 data-i18n="sectionCache"></h2>
      <dl class="stats">
        <div><dt data-i18n="statImages"></dt><dd id="count">-</dd></div>
        <div><dt data-i18n="statUsage"></dt><dd id="usage">-</dd></div>
        <div><dt data-i18n="statFavorites"></dt><dd id="favorites">-</dd></div>
      </dl>
      <div class="buttons">
        <button id="clear-unpinned" type="button" data-i18n="clearUnpinned"></button>
        <button id="clear-all" type="button" class="danger" data-i18n="clearAll"></button>
      </div>
      <small data-i18n="clearHint"></small>
    </section>

    <p id="message" role="status"></p>
  </main>
  <script type="module" src="options.js"></script>
</body>
</html>
