<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <main>
    <img id="thumbnail" alt="Bing Wallpaper HD" hidden />
    <h1 id="title">Bing Wallpaper HD</h1>
    <p id="copyright" class="muted"></p>
    <div id="actions" hidden>
      <button id="favorite" type="button" aria-pressed="false"></button>
      <button id="pin" type="button" aria-pressed="false"></button>
      <button id="save" type="button" data-i18n="saveOriginal"></button>
    </div>
    <dl id="details" hidden>
      <div><dt data-i18n="updatedLabel"></dt><dd id="updated"></dd></div>
    </dl>
    <p id="message" class="muted"></p>
    <div id="history"></div>
    <button id="fetch" type="button" data-i18n="fetchNow"></button>
  </main>
  <script type="module" src="popup.js"></script>
</body>
</html>
